slug: uiflow
title: UIFlow Computer-Use Automation
summary: LLM-guided browser workflow discovery compiled into typed, policy-controlled artifacts for
  deterministic replay without a model in the decision loop
status: Featured
duration: Open-source project
role: Developer
tags:
